# Lint Go (make lint). Constitution, principe 9 ; CLAUDE.md « Définition de terminé ».
version: "2"
linters:
  default: standard
  enable:
    - gosec
  settings:
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1005"] # ST1005 : « Warpgate » est un nom propre, message affiché tel quel
    gosec:
      excludes:
        - G104 # doublon d'errcheck, déjà réglé par le préréglage std-error-handling
  exclusions:
    presets:
      - std-error-handling # Close, Fprint… sur les chemins de nettoyage
      - common-false-positives
    rules:
      # Les tests lancent des sous-processus, lisent des fichiers temporaires et ignorent
      # volontairement les erreurs de préparation (le test échoue de toute façon ensuite).
      - path: _test\.go
        linters: [gosec, errcheck]
      # Aides de test, jamais importées par le code de production.
      - path: internal/(sshtest|syslog/syslogtest|oidc/oidctest|testkit)/
        linters: [gosec, errcheck]
