# Exemple de déploiement. Créez un fichier .env à côté (voir le wiki, page Installation : https://gitea.dewarlez.fr/sebastien/Leassh/wiki/FR-Installation) :
#   LEASSH_MASTER_KEY=<openssl rand -base64 32>
#   LEASSH_SETUP_TOKEN=<openssl rand -base64 24>   (facultatif, instance neuve)
# Le reste (URL publique, reverse proxies de confiance, rétention…) se règle dans l'interface : Réglages → Général.
services:
  leassh:
    image: gitea.dewarlez.fr/sebastien/leassh:latest   # ou : build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"           # exposez via un reverse proxy TLS, pas directement
    volumes:
      - leassh-data:/data
    environment:
      LEASSH_MASTER_KEY: ${LEASSH_MASTER_KEY:?définissez LEASSH_MASTER_KEY dans .env}
      LLM_BASE_URL: ${LLM_BASE_URL:-}   # facultatif : valeurs par défaut de la synthèse IA (voir .env.example)
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LEASSH_SETUP_TOKEN: ${LEASSH_SETUP_TOKEN:-}   # facultatif : sinon affiché une fois dans les logs au premier démarrage
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  leassh-data:
