# CI Leassh — qualité (lint, tests) et sécurité (secrets, dépendances).
# Constitution : principes 5 (gitleaks), 7 (Trivy), 9 (rien n'est fusionné sans CI verte).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Forcer la version (ex. 1.0.0) au lieu de la déduire des commits. Réservé aux jalons (1.0.0)."
        required: false

jobs:
  qualite:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Dépendances frontend
        run: cd web && npm ci --no-audit --no-fund
      - name: Lint
        run: make lint
      - name: Tests
        run: make test

  integration-ssh:
    # Vrai sshd (linuxserver/openssh-server, image figée par empreinte) lancé par le test via Docker.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Image sshd (téléchargement hors du test)
        run: docker pull lscr.io/linuxserver/openssh-server@sha256:aa4e1b3916e8555f24e574e6108b0b89a1b20362b0a11800a71280b45999649e
      - name: Tests d'intégration SSH
        run: go test -tags integration ./internal/sshexec -run Integration -v -timeout 10m

  e2e:
    # Parcours navigateur (Playwright) sur le binaire réel : parcours principaux, parcours fonctionnels (sshd Docker, MCP, validations) puis balayage de tous les écrans (clair/sombre, bureau/mobile, axe).
    # Version figée : Playwright ne supporte pas encore Ubuntu 26.04 (ubuntu-latest).
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build (frontend + binaire)
        run: make build
      - name: Image sshd (parcours d'exécution réelle)
        run: docker pull lscr.io/linuxserver/openssh-server@sha256:aa4e1b3916e8555f24e574e6108b0b89a1b20362b0a11800a71280b45999649e
      - name: Parcours de bout en bout
        run: make e2e
      - name: Rapport Playwright (captures de tous les écrans)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  securite:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks analyse tout l'historique
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: gitleaks (secrets)
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
      - name: Trivy (dépendances, Dockerfile, secrets, configuration)
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz | tar -xz trivy
          ./trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
      - name: Trivy (image Docker construite)
        run: |
          docker build --build-arg VERSION=ci -t leassh:ci .
          ./trivy image --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 leassh:ci
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: npm audit
        run: cd web && npm audit --audit-level=high

  release:
    # Version et package à chaque merge dans main, une fois toute la CI verte (ticket #87).
    # Version SemVer déduite des Conventional Commits mergés depuis le dernier tag : feat -> B, fix/perf -> C,
    # `!` ou BREAKING CHANGE -> A ; docs, test, chore, ci... ne publient rien. Le 1.0.0 se déclenche à la main (input `version`).
    needs: [qualite, integration-ssh, e2e, securite]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # tag et release GitHub
      packages: write # image sur ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calcul de la version et tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          release_branches: main
          custom_tag: ${{ inputs.version }}
      - uses: actions/setup-go@v5
        if: steps.tag.outputs.new_tag != ''
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        if: steps.tag.outputs.new_tag != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Binaires (linux amd64 et arm64)
        if: steps.tag.outputs.new_tag != ''
        env:
          VERSION: ${{ steps.tag.outputs.new_tag }}
        run: |
          make web
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/leassh_${VERSION}_linux_${arch}" ./cmd/leassh
          done
          (cd dist && sha256sum leassh_* > SHA256SUMS)
      - uses: docker/setup-buildx-action@v3
        if: steps.tag.outputs.new_tag != ''
      - uses: docker/login-action@v3
        if: steps.tag.outputs.new_tag != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image multi-architecture
        if: steps.tag.outputs.new_tag != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.tag.outputs.new_tag }}
          tags: |
            ghcr.io/sebdew/leassh:${{ steps.tag.outputs.new_version }}
            ghcr.io/sebdew/leassh:latest
      - name: Release GitHub
        if: steps.tag.outputs.new_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
